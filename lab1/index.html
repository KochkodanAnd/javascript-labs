<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lab 1 JS Triangle</title>
</head>
<body>

<h1>Лабораторна робота №1</h1>
<p>Відкрий консоль браузера: F12 → Console</p>

<script>
console.log("Використання:");
console.log('triangle(4, "leg", 8, "hypotenuse");');
console.log('Типи: "leg", "hypotenuse", "angle", "adjacent angle", "opposite angle"');

function toRadians(degrees) {
    return degrees * Math.PI / 180;
}

function toDegrees(radians) {
    return radians * 180 / Math.PI;
}

function round(num) {
    return Math.round(num * 100) / 100;
}

function triangle(value1, type1, value2, type2) {
    let a, b, c, alpha, beta;

    type1 = type1.toLowerCase();
    type2 = type2.toLowerCase();

    if (value1 <= 0 || value2 <= 0) {
        console.log("Помилка: значення мають бути більші за 0");
        return "Некоректні значення";
    }

    if (type1 === "hypotenuse" && type2 !== "hypotenuse") {
        return triangle(value2, type2, value1, type1);
    }

    if (type1 === "angle" && type2 === "hypotenuse") {
        return triangle(value2, type2, value1, type1);
    }

    if (type1 === "opposite angle" && type2 === "leg") {
        return triangle(value2, type2, value1, type1);
    }

    if (type1 === "adjacent angle" && type2 === "leg") {
        return triangle(value2, type2, value1, type1);
    }

    if (type1 === "leg" && type2 === "leg") {
        a = value1;
        b = value2;
        c = Math.sqrt(a * a + b * b);
        alpha = toDegrees(Math.asin(a / c));
        beta = 90 - alpha;
    }

    else if (type1 === "leg" && type2 === "hypotenuse") {
        a = value1;
        c = value2;

        if (a >= c) {
            console.log("Помилка: катет не може бути більший або рівний гіпотенузі");
            return "Некоректні значення";
        }

        b = Math.sqrt(c * c - a * a);
        alpha = toDegrees(Math.asin(a / c));
        beta = 90 - alpha;
    }

    else if (type1 === "hypotenuse" && type2 === "angle") {
        c = value1;
        alpha = value2;

        if (alpha <= 0 || alpha >= 90) {
            console.log("Помилка: гострий кут має бути від 0 до 90 градусів");
            return "Некоректні значення";
        }

        beta = 90 - alpha;
        a = c * Math.sin(toRadians(alpha));
        b = c * Math.cos(toRadians(alpha));
    }

    else if (type1 === "leg" && type2 === "opposite angle") {
        a = value1;
        alpha = value2;

        if (alpha <= 0 || alpha >= 90) {
            console.log("Помилка: гострий кут має бути від 0 до 90 градусів");
            return "Некоректні значення";
        }

        beta = 90 - alpha;
        c = a / Math.sin(toRadians(alpha));
        b = c * Math.cos(toRadians(alpha));
    }

    else if (type1 === "leg" && type2 === "adjacent angle") {
        a = value1;
        beta = value2;

        if (beta <= 0 || beta >= 90) {
            console.log("Помилка: гострий кут має бути від 0 до 90 градусів");
            return "Некоректні значення";
        }

        alpha = 90 - beta;
        c = a / Math.cos(toRadians(beta));
        b = c * Math.sin(toRadians(beta));
    }

    else {
        console.log("Помилка: неправильні типи. Перечитайте інструкцію.");
        return "failed";
    }

    console.log("a =", round(a));
    console.log("b =", round(b));
    console.log("c =", round(c));
    console.log("alpha =", round(alpha) + "°");
    console.log("beta =", round(beta) + "°");

    return "success";
}
</script>

</body>
</html>
